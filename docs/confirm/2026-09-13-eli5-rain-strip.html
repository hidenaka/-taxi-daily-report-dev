<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>いつ降るかが色で分かる</title>
<style>
  :root{
    --ink:#1a1a1a; --ink2:#5a5a5a; --bg:#fbf7ef; --card:#fff; --line:#e2dccb;
    --ok:#12a37f; --ng:#d4483b; --yel:#f5c542; --blue:#2f6fd0;
    --sans:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.75;-webkit-font-smoothing:antialiased}
  .wrap{max-width:880px;margin:0 auto;padding:48px 22px 90px}
  h1{font-size:36px;line-height:1.3;margin:0 0 10px}
  .sub{font-size:19px;color:var(--ink2);margin:0 0 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 22px 26px;margin:0 0 30px;box-shadow:0 8px 26px rgba(0,0,0,.05)}
  .card h2{font-size:26px;line-height:1.35;margin:0 0 6px}
  .card .lede{font-size:17px;color:var(--ink2);margin:0 0 18px}
  svg,img{display:block;width:100%;height:auto;border-radius:10px}
  figcaption{font-size:13.5px;color:var(--ink2);text-align:center;margin-top:10px}
  .note{margin:16px 0 0;padding:14px 16px;background:#fdf6e0;border-left:5px solid var(--yel);border-radius:0 10px 10px 0;font-size:15.5px}
  .note b{color:#8a6a08}
  .end{margin-top:6px;padding:26px 24px;background:var(--ink);color:#f7f3e8;border-radius:18px}
  .end h2{color:var(--yel);margin:0 0 12px;font-size:23px}
  .end ul{margin:0;padding-left:20px} .end li{margin:8px 0;font-size:16px}
  @media(max-width:640px){h1{font-size:25px}.card h2{font-size:20px}.card{padding:18px 14px 20px}}
</style>
</head>
<body>
<div class="wrap">

  <h1>バーの色で<span style="color:#12a37f">いつ降るか</span>が分かります</h1>
  <p class="sub">いま見ている場所の雨だけを、時間順に並べました。</p>

  <div class="card">
    <h2>こう見えます</h2>
    <figure>
      <svg viewBox="0 0 880 250" role="img" aria-label="時刻バーの上に雨の強さの帯が出る">
        <rect width="880" height="250" fill="#fff"/>
        <rect x="40" y="30" width="800" height="180" rx="12" fill="#15151c"/>

        <text x="64" y="66" font-size="17" font-weight="700" fill="#fff">18:05</text>
        <text x="128" y="66" font-size="13" fill="#cfd6dd">いま</text>

        <!-- 帯 -->
        <rect x="64" y="84" width="752" height="16" rx="4" fill="#23232c"/>
        <rect x="196" y="84" width="10" height="16" fill="#f2f2ff"/>
        <rect x="208" y="84" width="10" height="16" fill="#a0d2ff"/>
        <rect x="220" y="84" width="8" height="16" fill="#f2f2ff"/>
        <rect x="560" y="84" width="120" height="16" fill="#a0d2ff"/>
        <rect x="680" y="84" width="60" height="16" fill="#218cff"/>
        <rect x="740" y="84" width="40" height="16" fill="#0041ff"/>

        <!-- スライダー -->
        <rect x="64" y="112" width="752" height="6" rx="3" fill="#3a3a46"/>
        <rect x="64" y="112" width="132" height="6" rx="3" fill="#4da3ff"/>
        <circle cx="196" cy="115" r="9" fill="#fff"/>

        <g font-size="11" fill="#9aa4ae">
          <text x="64" y="140">3時間前</text>
          <text x="196" y="140" text-anchor="middle" fill="#cfe6ff">いま</text>
          <text x="400" y="140" text-anchor="middle">22時</text>
          <text x="600" y="140" text-anchor="middle">2時</text>
          <text x="816" y="140" text-anchor="end">8時</text>
        </g>

        <text x="212" y="182" text-anchor="middle" font-size="12.5" fill="#f2f2ff">ぱらつく</text>
        <text x="660" y="182" text-anchor="middle" font-size="12.5" fill="#7fc4ff">朝方に強まる</text>
      </svg>
      <figcaption>色が濃いほど強い雨。色が無いところは降りません</figcaption>
    </figure>
    <div class="note"><b>色の意味は、地図の右上の凡例と同じです。</b>薄い水色＝弱い雨、青＝しっかり、黄・赤＝強い雨。</div>
  </div>

  <div class="card">
    <h2>実際の画面（福岡）</h2>
    <figure>
      <img src="images/rain-strip.jpg" alt="福岡を表示したときの時刻バー。朝方に色が並んでいる">
      <figcaption>地図は雨だらけでも、「自分のいる場所」がいつ降るかはバーを見れば分かります</figcaption>
    </figure>
  </div>

  <div class="card">
    <h2>どうやって出しているか</h2>
    <figure>
      <svg viewBox="0 0 880 200" role="img" aria-label="地図の真ん中の1点の色を、コマごとに読む">
        <rect width="880" height="200" fill="#fff"/>
        <rect x="60" y="34" width="240" height="130" rx="10" fill="#eef1f4" stroke="#c9c2ad" stroke-width="2"/>
        <ellipse cx="180" cy="90" rx="60" ry="36" fill="#8fc6f0"/>
        <ellipse cx="190" cy="94" rx="28" ry="16" fill="#3d8fe0"/>
        <circle cx="180" cy="99" r="6" fill="#e5443a" stroke="#fff" stroke-width="2"/>
        <text x="180" y="146" text-anchor="middle" font-size="13">地図の真ん中の1点</text>

        <text x="360" y="100" text-anchor="middle" font-size="24" fill="#5a5a5a">→</text>

        <rect x="420" y="34" width="400" height="130" rx="10" fill="#f6f4ec" stroke="#c9bfa0" stroke-width="2"/>
        <text x="620" y="66" text-anchor="middle" font-size="14">その1点の色を、62コマぶん読む</text>
        <g>
          <rect x="470" y="84" width="20" height="20" fill="#f2f2ff" stroke="#ddd"/>
          <rect x="496" y="84" width="20" height="20" fill="#a0d2ff"/>
          <rect x="522" y="84" width="20" height="20" fill="#218cff"/>
          <rect x="548" y="84" width="20" height="20" fill="#0041ff"/>
          <rect x="574" y="84" width="20" height="20" fill="#faf500"/>
          <rect x="600" y="84" width="20" height="20" fill="#ff9900"/>
          <rect x="626" y="84" width="20" height="20" fill="#ff2800"/>
          <rect x="652" y="84" width="20" height="20" fill="#b40068"/>
          <text x="700" y="99" font-size="12" fill="#5a5a5a">の8段階</text>
        </g>
        <text x="620" y="140" text-anchor="middle" font-size="12.5" fill="#5a5a5a">時間の順に並べて帯にする</text>
      </svg>
      <figcaption>地図に出ている雨の絵から、その場所の色をそのまま拾っています</figcaption>
    </figure>
    <div class="note"><b>場所を変えると、すぐ調べ直します。</b>「📍 場所」で選んでも、地図を指で動かしても追いかけます。</div>
  </div>

  <div class="end">
    <h2>まとめ</h2>
    <ul>
      <li>時刻バーの上に、<b>その場所の雨</b>が色で並びます。</li>
      <li>色が無い時間は降りません。全部無ければ「この先ずっと雨なし」と出ます。</li>
      <li>場所を変えると追いかけます。</li>
      <li><b>本番に出しました（v400）。</b>テスト1222件すべて通っています。</li>
    </ul>
  </div>

</div>
</body>
</html>

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry_1.outputs.page_url || steps.deploy_retry_2.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before first retry
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages retry 1
        id: deploy_retry_1
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before second retry
        if: steps.deploy.outcome == 'failure' && steps.deploy_retry_1.outcome == 'failure'
        run: sleep 120

      - name: Deploy to GitHub Pages retry 2
        id: deploy_retry_2
        if: steps.deploy.outcome == 'failure' && steps.deploy_retry_1.outcome == 'failure'
        uses: actions/deploy-pages@v4

name: Retry failed deploy

# Pages のデプロイが GitHub 側の一時障害で落ちたとき、自動でやり直す。
#
# pages.yml には既にステップ単位のリトライ（deploy を最大3回）が入っているが、
# 実際に落ちているのはステップが動く前の段階だった:
#   - "Failed to resolve action download info. Error: Service Unavailable"
#     （アクションの取得に失敗＝ステップが1つも実行されない）
#   - "The job was not acquired by Runner of type hosted"
#     （ジョブがランナーに載らない）
# これらはステップ内リトライでは救えないので、ジョブ丸ごとを再実行する。
#
# 無限ループ防止: 再実行は run_attempt が 3 未満のときだけ。
# 3回やっても落ちるなら本当の異常なので、そのまま失敗として残す。

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          echo "run ${RUN_ID} が失敗（attempt ${ATTEMPT}）。失敗ジョブを再実行します。"
          # 一時障害が続いている場合に備えて少し待つ
          sleep 45
          gh run rerun "${RUN_ID}" --failed -R "${GITHUB_REPOSITORY}"

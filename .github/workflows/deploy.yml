name: Deploy to Production
on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout dev repo
        uses: actions/checkout@v4
        with:
          path: dev
          
      - name: Checkout prod repo
        uses: actions/checkout@v4
        with:
          repository: hidenaka/taxi-daily-report
          token: ${{ secrets.PROD_DEPLOY_TOKEN }}
          path: prod
          
      - name: Copy files to prod
        run: |
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='docs/' \
            --exclude='scripts/' \
            --exclude='.opencode/' \
            --exclude='.DS_Store' \
            --exclude='node_modules/' \
            --exclude='CNAME' \
            dev/ prod/

      - name: Cache-bust local JS (prevent stale-import skew)
        # index.html(短命)と tools/js/*.js(最大4hキャッシュ)の版ズレで ESM import が
        # 失敗しタイマー等が停止するのを恒久防止。デプロイ毎にコミットSHAをJS参照URLへ
        # 付与し、4時間キャッシュを確実に貫通させる(新HTMLは必ず同デプロイの新JSを取得)。
        # scripts/ は rsync 除外なので dev 側にのみ存在。失敗時はジョブが止まり本番は前版維持。
        run: node dev/scripts/cache-bust.mjs prod "${{ github.sha }}"

      - name: Commit and push to prod
        working-directory: prod
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "deploy: sync from dev repo (${{ github.sha }})"
            git push origin main
          fi
          
      - name: Deployment complete
        run: echo "Production deployment complete"

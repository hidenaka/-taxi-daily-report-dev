name: Deploy to Production
on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout dev repo
        uses: actions/checkout@v7
        with:
          path: dev
          
      - name: Checkout prod repo
        uses: actions/checkout@v7
        with:
          repository: hidenaka/taxi-daily-report
          token: ${{ secrets.PROD_DEPLOY_TOKEN }}
          path: prod
          
      - name: Copy files to prod
        run: |
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='docs/' \
            --exclude='scripts/' \
            --exclude='.opencode/' \
            --exclude='.DS_Store' \
            --exclude='node_modules/' \
            --exclude='CNAME' \
            dev/ prod/

      - name: Cache-bust local JS (prevent stale-import skew)
        # Prevent stale ESM imports when HTML updates before cached JS expires.
        # scripts/ is excluded from rsync, so this runs from the dev checkout.
        # On failure, the job stops and production keeps the previous version.
        run: node dev/scripts/cache-bust.mjs prod "${{ github.sha }}"

      - name: Commit and push to prod
        working-directory: prod
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "deploy: sync from dev repo (${{ github.sha }})"
            git push origin main
          fi
          
      - name: Deployment complete
        run: echo "Production deployment complete"

name: Snapshot arrivals (daily)

# 到着便データ(tools/data/arrivals.json)は1日分の上書きなので、そのままだと
# 前日分がどこにも残らない。1日1回、その日の最終版を日付別に切り出して残す。
#
# あわせて「本日の配車業務は終了しました」の掲示が出た時刻も記録する。
# この掲示は 0:20〜2:00 頃に出る(実測: 9/5 02:00 / 9/6 00:50 / 9/7 01:14 /
# 9/8 00:21 / 9/9 01:30)ので、日付が変わったあとに拾う必要がある。
# 「何時まで客がいたか」を後から確かめるための、乗務員にとって一番効く指標。
#
# relay の push をトリガーにしない: relay は10分おきに来るうえ、ここで push すると
# 自分自身を再び起こしてループになる。cron なら安全で軽い。

on:
  schedule:
    # 23:55 JST … その日の arrivals を切り出す（更新は 23:45 が最後）
    - cron: '55 14 * * *'
    # 0:10〜3:00 JST の20分おき … 終了掲示が出た時刻を捕まえる
    - cron: '*/20 15-18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-arrivals
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 日付別スナップショットと、この日のまとめを更新
        run: |
          set -euo pipefail
          node .github/scripts/snapshot-arrivals.mjs

      - name: コミット
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/data/arrivals-days
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "chore(data): snapshot arrivals $(TZ=Asia/Tokyo date +%Y-%m-%d\ %H:%M) JST"
          # relay と push が衝突しうるので、取り込んでから何度か試す
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "retry $i"; sleep 10
          done
          echo "push できなかった"; exit 1

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cabis ｜ 乗り場マップ</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
  <link rel="icon" type="image/png" sizes="180x180" href="icon-180.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a0f">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <style>
    body{visibility:hidden;pointer-events:none;}
    #stands-map{position:fixed;top:48px;left:0;right:0;bottom:0;}
    .app-tabs{position:fixed;top:0;left:0;right:0;z-index:1200;}
    #stand-sheet{position:fixed;left:0;right:0;bottom:0;z-index:1300;background:var(--surface,#15151c);
      color:var(--text,#fff);border-top-left-radius:14px;border-top-right-radius:14px;
      padding:14px 16px 22px;box-shadow:0 -4px 16px rgba(0,0,0,.4);transform:translateY(110%);
      transition:transform .2s;max-height:55vh;overflow:auto;}
    #stand-sheet.open{transform:translateY(0);}
    body.stands-editing #stand-sheet{display:none !important;}
    #stand-sheet h3{margin:0 0 6px;font-size:17px;}
    #stand-sheet .notes{font-size:14px;line-height:1.6;}
    .entry-card{margin:6px 0 10px;padding:10px 12px;background:rgba(255,255,255,.06);border-radius:10px;border-left:3px solid #1d6fe0;}
    .entry-card-h{font-size:12px;font-weight:700;color:#9bd;letter-spacing:.04em;margin-bottom:6px;}
    .entry-card-h.sub{margin-top:10px;color:#fc6;}
    .entry-list,.cautions{margin:0;padding-left:18px;font-size:14px;line-height:1.55;}
    .entry-list li{margin-bottom:6px;}
    .entry-list .road{font-weight:600;color:#7be;}
    .entry-list .hint{margin-top:2px;font-size:13px;color:#bbb;line-height:1.5;}
    .entry-list{list-style:none;padding-left:0;}
    .entry-list .appr-item{margin-bottom:6px;padding:7px 9px;border-radius:8px;cursor:pointer;border:1px solid transparent;transition:background .12s;}
    .entry-list .appr-item:hover{background:rgba(255,255,255,.07);}
    .entry-list .appr-item.is-active{background:rgba(29,111,224,.2);border-color:rgba(123,190,238,.55);}
    .entry-hint{font-weight:400;color:#89a;font-size:11px;}
    .turn-badge{display:inline-block;padding:1px 6px;border-radius:8px;font-size:11px;font-weight:700;margin-right:6px;vertical-align:1px;}
    .turn-badge.t-left-only{background:#f1c40f;color:#222;}
    .turn-badge.t-right-ok{background:#1d6fe0;color:#fff;}
    .cautions li{margin-bottom:4px;color:#fdd;}
    .raw-notes{margin-top:10px;padding-top:10px;border-top:1px dashed #555;font-size:13px;color:#aaa;line-height:1.55;white-space:pre-wrap;}
    #stand-sheet .close{position:absolute;top:8px;right:12px;font-size:20px;background:none;border:none;color:inherit;}
    #sheet-images{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
    #sheet-images img{width:100%;border-radius:8px;border:1px solid rgba(0,0,0,.15);background:#fff;cursor:zoom-in;}
    #img-overlay{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.92);display:none;overflow:auto;-webkit-overflow-scrolling:touch;}
    #img-overlay.open{display:block;}
    #img-overlay img{display:block;width:100%;max-width:1400px;margin:0 auto;}
    #img-overlay .x{position:fixed;top:8px;right:14px;font-size:30px;color:#fff;background:none;border:none;z-index:2001;}
    #stand-search{position:fixed;top:54px;left:8px;right:8px;z-index:1260;display:flex;gap:6px;}
    #search-input{flex:1;min-width:0;padding:9px 11px;border-radius:9px;border:1px solid #bbb;font-size:15px;box-shadow:0 1px 4px rgba(0,0,0,.2);}
    #search-near{padding:9px 11px;border-radius:9px;border:1px solid #bbb;background:#fff;color:#111;font-size:13px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.2);}
    #search-results{position:fixed;top:98px;left:8px;right:8px;z-index:1260;background:#fff;color:#111;border-radius:10px;max-height:55vh;overflow:auto;box-shadow:0 6px 20px rgba(0,0,0,.35);display:none;}
    #search-results.open{display:block;}
    #search-results .r{padding:10px 13px;border-bottom:1px solid #eee;font-size:15px;cursor:pointer;}
    #search-results .r:active{background:#eef;}
    #search-results .r .cat{font-size:11px;color:#888;margin-left:8px;}
    #search-results .r .dist{float:right;color:#2980b9;font-size:12px;}
    #search-results .empty{padding:12px 13px;color:#888;font-size:13px;}
    #stands-editbar{position:fixed;top:100px;right:8px;z-index:1250;display:none;flex-direction:column;gap:6px;}
    #stands-editbar.show{display:flex;}
    #stands-editbar button{font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--border,#333);background:#222;color:#fff;}
    #georef-overlay{position:fixed;inset:0;z-index:1800;background:#0e0e10;color:#fff;display:flex;flex-direction:column;}
    #georef-overlay[hidden]{display:none;}
    #georef-overlay .g-bar{display:flex;gap:8px;align-items:center;padding:8px 10px;background:#1a1a20;border-bottom:1px solid #333;flex-wrap:wrap;}
    #georef-overlay .g-title{font-weight:700;font-size:15px;margin-right:6px;}
    #georef-overlay .g-status{color:#9bd;font-size:13px;margin-right:8px;}
    #georef-overlay .g-bar button{font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;}
    #georef-overlay .g-bar button:disabled{opacity:.4;}
    #georef-overlay .g-body{flex:1;display:flex;min-height:0;}
    @media (max-width:760px){#georef-overlay .g-body{flex-direction:column;}}
    #georef-overlay .g-pane{flex:1;min-width:0;min-height:0;position:relative;border:1px solid #222;overflow:hidden;}
    #georef-overlay .g-pdf{background:#fff;}
    #georef-overlay .g-pdf-wrap{position:absolute;inset:0;overflow:auto;}
    #georef-overlay #g-pdf-img{display:block;max-width:none;cursor:crosshair;user-select:none;}
    #georef-overlay .g-map #g-map{position:absolute;inset:0;cursor:crosshair;}
    .g-marker{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font-weight:700;font-size:12px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.6);}
    .g-marker.pdf{background:#c0392b;}
    .g-marker.geo{background:#1d6fe0;}
    .g-preview-line{stroke:#27ae60;stroke-width:5;opacity:.9;}
  </style>
</head>
<body>
  <script type="module">
    import { enforceAccess } from '../js/access-control.js';
    if (!(await enforceAccess('core', { redirect: '../subscribe.html' }))) {
      throw new Error('access-denied: redirected');
    }
  </script>
  <script src="../vendor/leaflet/leaflet.js"></script>
  <nav class="app-tabs" role="tablist" aria-label="アプリ切替">
    <a href="./" class="app-tab">⏱ 乗務タイマー</a>
    <a href="ic.html" class="app-tab">🛣 IC判定</a>
    <a href="arrivals.html" class="app-tab">✈ 空港ツール</a>
    <a href="stands.html" class="app-tab active" aria-current="page">📍 乗り場</a>
  </nav>
  <div id="stands-map"></div>
  <div id="stand-search">
    <input id="search-input" type="search" placeholder="施設名・キーワードで検索（例: 病院, 六本木）" autocomplete="off">
    <button id="search-near" type="button">📍 近く</button>
  </div>
  <div id="search-results"></div>
  <div id="stands-editbar">
    <button id="ed-toggle" type="button">✏️ 編集モード</button>
  </div>
  <div id="stand-sheet" aria-live="polite">
    <button class="close" id="sheet-close" type="button" aria-label="閉じる">×</button>
    <h3 id="sheet-name"></h3>
    <div class="notes" id="sheet-notes"></div>
    <div id="sheet-images"></div>
  </div>
  <div id="img-overlay"><button class="x" id="img-overlay-close" type="button" aria-label="閉じる">×</button><img id="img-overlay-img" alt=""></div>
  <script type="module" src="js/stands-app.js"></script>
  <div id="georef-overlay" hidden>
    <div class="g-bar">
      <span class="g-title">📐 PDF合わせ</span>
      <span class="g-status" id="g-status">対応点 0/4</span>
      <button id="g-undo" type="button">↩ やり直し</button>
      <button id="g-compute" type="button" disabled>変換</button>
      <button id="g-save" type="button" disabled>💾 保存</button>
      <button id="g-close" type="button">✖ 閉じる</button>
    </div>
    <div class="g-body">
      <div class="g-pane g-pdf">
        <div class="g-pdf-wrap"><img id="g-pdf-img" alt=""></div>
      </div>
      <div class="g-pane g-map"><div id="g-map"></div></div>
    </div>
  </div>
</body>
</html>

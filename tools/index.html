<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Cabis ｜ 乗務タイマー</title>
  <link rel="icon" type="image/png" sizes="180x180" href="icon-180.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="乗務タイマー">
  <meta name="theme-color" content="#0a0a0f">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: linear-gradient(180deg, #0a0a0f 0%, #15151c 100%);
      background-attachment: fixed;
      color: #f0f0f0;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Back link to daily report */
    .back-link {
      display: block; padding: 8px 14px; background: #1a1a24;
      border-bottom: 1px solid rgba(255,255,255,0.08); color: #8a8a92;
      text-decoration: none; font-size: 13px;
    }
    .back-link:hover { color: #f0f0f0; background: #22222e; }

    /* Top tabs (shared with index.html) */
    .app-tabs {
      display: flex; position: sticky; top: 0; z-index: 10;
      background: #0a0a0f; border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-top: env(safe-area-inset-top);
    }
    .app-tab {
      flex: 1; padding: 14px 8px; text-align: center; text-decoration: none;
      color: #8a8a92; font-size: 15px; font-weight: 600; letter-spacing: 0.3px;
      border-bottom: 3px solid transparent;
      -webkit-tap-highlight-color: transparent;
    }
    .app-tab.active {
      color: #f0f0f0; border-bottom-color: #3a7bd5;
      background: rgba(58, 123, 213, 0.10);
    }
    .app-tab:active { background: rgba(255,255,255,0.05); }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 20px 20px 40px;
    }
    header { padding: 8px 4px 20px; }
    header h1 {
      font-size: 22px;
      margin: 0 0 2px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    header p {
      font-size: 13px;
      margin: 0;
      color: #8a8a92;
      letter-spacing: 0.2px;
    }

    section {
      margin-bottom: 14px;
      padding: 20px;
      background: rgba(40, 40, 48, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .settings { padding: 0; }
    .settings-toggle {
      width: 100%;
      background: transparent;
      color: #c0c0c8;
      border: none;
      padding: 16px 20px;
      font-size: 15px;
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 52px;
      box-shadow: none;
      letter-spacing: 0.3px;
      border-radius: 16px;
    }
    .settings-toggle .chevron {
      transition: transform 0.2s;
      font-size: 12px;
      color: #8a8a92;
    }
    .settings-toggle[aria-expanded="true"] .chevron { transform: rotate(180deg); }
    .settings-content {
      padding: 0 20px 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .settings-content[hidden] { display: none; }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
    }
    .setting-row + .setting-row { border-top: 1px solid rgba(255, 255, 255, 0.05); }
    .setting-row label {
      font-size: 15px;
      color: #c0c0c8;
      font-weight: 500;
    }
    .setting-row input[type="time"],
    .setting-row input[type="number"] {
      font-size: 18px;
      padding: 8px 14px;
      background: #0a0a0f;
      color: #f0f0f0;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }
    .hm-input { display: flex; align-items: center; gap: 6px; }
    .hm-input input {
      width: 64px;
      text-align: right;
      font-size: 18px;
      padding: 8px 10px;
      background: #0a0a0f;
      color: #f0f0f0;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }
    .hm-input span { color: #8a8a92; font-size: 14px; }

    .stopwatch {
      text-align: center;
      padding: 32px 20px 24px;
    }
    #stopwatch-display {
      font-size: 76px;
      font-variant-numeric: tabular-nums;
      font-weight: 200;
      margin: 0 0 6px;
      letter-spacing: -2px;
      background: linear-gradient(180deg, #ffffff 0%, #a8a8b0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stopwatch-started {
      font-size: 13px;
      color: #8a8a92;
      font-variant-numeric: tabular-nums;
      margin: 0 0 4px;
      min-height: 18px;
      letter-spacing: 0.3px;
    }
    .provisional-break {
      font-size: 15px;
      color: #7cb8ff;
      font-variant-numeric: tabular-nums;
      margin: 0 0 22px;
      min-height: 20px;
      letter-spacing: 0.3px;
      font-weight: 600;
    }
    .provisional-break:empty { display: none; }
    .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      min-height: 50px;
      min-width: 104px;
      padding: 0 24px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
      letter-spacing: 0.3px;
    }
    button:active { transform: scale(0.97); opacity: 0.85; }
    button:disabled {
      background: rgba(255, 255, 255, 0.08) !important;
      color: #555 !important;
      cursor: not-allowed;
      box-shadow: none !important;
    }
    #btn-start {
      background: linear-gradient(180deg, #4a90e2 0%, #3a7bd5 100%);
      color: white;
      box-shadow: 0 2px 8px rgba(58, 123, 213, 0.3);
    }
    #btn-record {
      background: linear-gradient(180deg, #34c759 0%, #2ea043 100%);
      color: white;
      box-shadow: 0 2px 8px rgba(46, 160, 67, 0.3);
    }
    #btn-discard {
      background: rgba(255, 255, 255, 0.08);
      color: #d0d0d8;
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 16px;
    }
    .metric-card {
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .metric-card .label {
      font-size: 11px;
      color: #8a8a92;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .metric-card .value {
      font-size: 22px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: #f0f0f0;
      letter-spacing: -0.3px;
    }
    .metric-card .sub {
      font-size: 12px;
      color: #8a8a92;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    .metric-card.primary {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, rgba(58, 123, 213, 0.15) 0%, rgba(46, 160, 67, 0.08) 100%);
      border-color: rgba(58, 123, 213, 0.3);
    }
    .metric-card.primary .value {
      font-size: 44px;
      font-weight: 700;
      color: #7cb8ff;
      letter-spacing: -1.2px;
      line-height: 1.1;
      margin: 2px 0 4px;
    }
    .metric-card.primary .sub {
      font-size: 14px;
      color: #c0c0c8;
    }
    .metric-card.primary.warn {
      background: linear-gradient(135deg, rgba(255, 149, 0, 0.18) 0%, rgba(255, 149, 0, 0.08) 100%);
      border-color: rgba(255, 149, 0, 0.5);
    }
    .metric-card.primary.warn .value { color: #ff9500; }
    .metric-card.primary.danger {
      background: linear-gradient(135deg, rgba(255, 59, 48, 0.2) 0%, rgba(255, 59, 48, 0.1) 100%);
      border-color: rgba(255, 59, 48, 0.6);
    }
    .metric-card.primary.danger .value { color: #ff3b30; }
    .metric-card.primary.over {
      background: linear-gradient(135deg, rgba(255, 59, 48, 0.3) 0%, rgba(139, 46, 46, 0.2) 100%);
      border-color: #ff3b30;
    }
    .metric-card.primary.over .value { color: #ff3b30; }
    .metric-card.complete {
      background: linear-gradient(135deg, rgba(58, 123, 213, 0.3) 0%, rgba(58, 123, 213, 0.12) 100%);
      border-color: rgba(58, 123, 213, 0.6);
    }
    .metric-card.complete .value { color: #7cb8ff; }
    .metric-card.complete .label { color: #7cb8ff; }

    .history h2 {
      font-size: 13px;
      margin: 0 0 12px;
      color: #8a8a92;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
    }
    .history-count { color: #f0f0f0; font-weight: 700; }
    .history-header {
      display: flex;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 2px;
    }
    .history-header span {
      font-size: 10px;
      color: #8a8a92;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 600;
      flex: 1;
    }
    .history-header span:nth-child(2) { text-align: center; }
    .history-header span:nth-child(3) { text-align: right; }
    #history-list { list-style: none; padding: 0; margin: 0; }
    #history-list li {
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-variant-numeric: tabular-nums;
      font-size: 15px;
      display: flex;
      align-items: center;
    }
    #history-list li:last-child { border-bottom: none; }
    #history-list li span { flex: 1; }
    #history-list .rec-time { color: #f0f0f0; font-weight: 600; }
    #history-list .rec-dur { color: #8a8a92; font-size: 13px; text-align: center; }
    #history-list .rec-next { color: #7cb8ff; font-size: 14px; font-weight: 600; text-align: right; }
    #history-list .btn-rec-delete {
      flex: 0 0 auto;
      min-width: 32px; min-height: 32px;
      margin-left: 10px;
      padding: 4px 8px;
      background: transparent;
      color: #8a8a92;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 4px;
      font-size: 18px; line-height: 1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #history-list .btn-rec-delete:active {
      background: rgba(255,82,82,0.12);
      color: #ff5252;
      border-color: rgba(255,82,82,0.4);
    }
    #history-list .btn-rec-edit {
      flex: 0 0 auto;
      min-width: 32px; min-height: 32px;
      margin-left: 6px;
      padding: 4px 8px;
      background: transparent;
      color: #8a8a92;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 4px;
      font-size: 14px; line-height: 1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #history-list .btn-rec-edit:active {
      background: rgba(124,184,255,0.12);
      color: #7cb8ff;
      border-color: rgba(124,184,255,0.4);
    }

    /* 記録編集ダイアログ */
    #edit-dialog {
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      background: #15151c;
      color: #f0f0f0;
      padding: 0;
      max-width: 92vw;
      width: 320px;
    }
    #edit-dialog::backdrop { background: rgba(0,0,0,0.6); }
    #edit-dialog .dialog-body { padding: 20px; }
    #edit-dialog h3 { margin: 0 0 14px; font-size: 17px; font-weight: 600; }
    #edit-dialog .field { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
    #edit-dialog .field label { flex: 0 0 70px; font-size: 14px; color: #c0c0c8; }
    #edit-dialog .field input[type="time"] {
      flex: 1; font-size: 17px; padding: 8px 12px;
      background: #0a0a0f; color: #f0f0f0;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
      font-variant-numeric: tabular-nums;
    }
    #edit-dialog .duration-preview {
      margin: 10px 0 4px; font-size: 13px; color: #8a8a92;
      text-align: center; min-height: 18px;
    }
    #edit-dialog .duration-preview.is-error { color: #ff5252; }
    #edit-dialog .dialog-actions {
      display: flex; gap: 8px; margin-top: 16px;
    }
    #edit-dialog button {
      flex: 1; min-height: 44px; min-width: 0;
      padding: 0 12px; font-size: 14px; font-weight: 600;
      border: none; border-radius: 10px; cursor: pointer;
    }
    #edit-dialog .btn-cancel {
      background: rgba(255,255,255,0.08); color: #d0d0d8;
    }
    #edit-dialog .btn-save {
      background: linear-gradient(180deg, #4a90e2 0%, #3a7bd5 100%);
      color: white;
    }
    #edit-dialog .btn-save:disabled {
      background: rgba(255,255,255,0.08) !important;
      color: #555 !important; cursor: not-allowed;
    }

    .reset { padding: 14px; text-align: center; display: grid; gap: 10px; }
    #btn-reset {
      background: linear-gradient(180deg, #4a90e2 0%, #3a7bd5 100%);
      color: white;
      width: 100%;
      border: none;
      box-shadow: 0 2px 8px rgba(58, 123, 213, 0.3);
    }
    #btn-undo-reset {
      background: transparent;
      color: #f0c060;
      width: 100%;
      border: 1px solid rgba(240, 192, 96, 0.4);
      padding: 10px;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    #btn-undo-reset:active { background: rgba(240, 192, 96, 0.12); }

    body { padding-bottom: 64px; }
    nav.bottom {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 56px; background: #1a1a24;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 50;
    }
    nav.bottom a {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-decoration: none; color: #8a8a92;
      font-size: 11px;
    }
    nav.bottom a.active { color: #4ea1ff; }
    /* === 使い方動画（input.html と同じデザイン） === */
    .help-video-btn { display: inline-flex; align-items: center; gap: 5px; margin-left: 6px; background: #e8f1fb; color: #0066cc; border: 1px solid #cfe2f7; border-radius: 999px; padding: 4px 10px; font-size: 11px; font-weight: 700; font-family: inherit; cursor: pointer; vertical-align: middle; min-height: 0; min-width: 0; }
    .help-video-btn:hover, .help-video-btn:focus { opacity: 0.85; outline: none; }
    .help-video { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
    .help-video.open { max-height: 780px; margin: 8px 0; }
    .hv-player { position: relative; width: 100%; max-width: 300px; margin: 0 auto; aspect-ratio: 9 / 16; background: #11151a; border-radius: 12px; overflow: hidden; }
    .hv-poster { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hv-play { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 46px; height: 46px; min-width: 0; min-height: 0; border-radius: 50%; background: rgba(255,255,255,0.95); color: #0066cc; border: none; font-size: 18px; padding: 0 0 0 3px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; }
    .hv-fallback { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; color: #fff; font-size: 12px; text-align: center; padding: 12px; }
    .hv-player.hv-error .hv-poster, .hv-player.hv-error .hv-play { display: none; }
    .hv-player.hv-error .hv-fallback { display: flex; }
    .hv-video { width: 100%; max-width: 300px; margin: 0 auto; display: block; border-radius: 12px; background: #000; aspect-ratio: 9 / 16; object-fit: contain; }
    .hv-cap { font-size: 11px; color: #9aa0a6; text-align: center; margin: 8px 0 0; }
    .hv-close { display: block; width: 100%; min-height: 0; margin-top: 10px; padding: 9px; background: #e8f1fb; color: #0066cc; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
.mode-switch { display: flex; gap: 6px; margin-bottom: 12px; }
.mode-btn {
  flex: 1; padding: 8px 6px; border: 1px solid var(--line, #d8d2bf);
  background: #fff; border-radius: 8px; font-size: 14px; cursor: pointer; color: #555;
}
.mode-btn.active { background: #1f6feb; color: #fff; border-color: #1f6feb; font-weight: 700; }
.countdown-panel {
  margin-bottom: 14px; padding: 12px; background: #f4f6fb;
  border: 1px solid #dbe2f0; border-radius: 10px; text-align: left;
}
.cd-label { font-size: 12px; color: #666; margin-bottom: 6px; }
.cd-presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.cd-preset {
  padding: 6px 12px; border: 1px solid #cdd6ea; background: #fff;
  border-radius: 999px; font-size: 13px; cursor: pointer; color: #333;
}
.cd-preset.active { background: #1f6feb; color: #fff; border-color: #1f6feb; font-weight: 700; }
.cd-custom { margin-bottom: 10px; }
.cd-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #333; margin-top: 6px; cursor: pointer; }
.cd-edit-link { background: none; border: 0; color: #1f6feb; font-size: 12px; cursor: pointer; padding: 0 4px; }
.cd-presets-editor { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
.cd-presets-editor[hidden] { display: none; }
.cd-preset-edit { width: 56px; padding: 6px; border: 1px solid #cdd6ea; border-radius: 8px; font-size: 14px; text-align: center; }
.cd-edit-done { padding: 6px 12px; border: 0; background: #1f6feb; color: #fff; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
.cd-sound-dur { margin: 8px 0 2px; }
.cd-sound-dur .cd-label { margin-bottom: 4px; }
.cd-sound-dur[hidden] { display: none; }
.btn-stop-alert { display: block; width: 100%; margin-top: 10px; padding: 12px; background: #c83a2c; color: #fff; border: 0; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
.btn-stop-alert[hidden] { display: none; }
.setting-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #333; margin-top: 10px; cursor: pointer; }
#move-threshold-row[hidden] { display: none; }
.move-detect-msg { font-size: 15px; margin: 8px 0; }
.move-detect-end { font-size: 14px; color: #555; margin: 4px 0 8px; }
#move-detect-dialog .btn-save { background: #c83a2c; }
#stopwatch-display.over { color: #c83a2c; }
@keyframes cd-flash { 0%,100% { background: transparent; } 50% { background: #f6dcd6; } }
.stopwatch.flash { animation: cd-flash 0.5s ease-in-out 3; border-radius: 12px; }
.countdown-over-note { font-size: 13px; color: #c83a2c; font-weight: 700; margin-top: 2px; min-height: 1em; }
  </style>
<style>body{visibility:hidden;pointer-events:none;}</style>
</head>
<body>
  <script type="module">
    import { enforceAccess } from '../js/access-control.js';
    if (!(await enforceAccess('core', { redirect: '../subscribe.html' }))) {
      throw new Error('access-denied: redirected');
    }
  </script>
  <nav class="app-tabs" role="tablist" aria-label="アプリ切替">
    <a href="./" class="app-tab active" aria-current="page">⏱ 乗務タイマー</a>
    <a href="ic.html" class="app-tab">🛣 IC判定</a>
    <a href="arrivals.html" class="app-tab">✈ 空港ツール</a>
    <a href="stands.html" id="tab-stands" class="app-tab" style="display:none">📍 乗り場</a>
  </nav>
  <script type="module" src="js/stands-tab.js"></script>
  <main>
    <header>
      <h1>タクシー乗務タイマー<button class="help-video-btn" data-help-video="timer" type="button">▶ 使い方（30秒）</button></h1>
      <p id="today-date">----/--/-- (-)</p>
    </header>
    <div class="help-video" id="help-video-timer" style="padding:0 4px;"></div>

    <section class="stopwatch">
      <div class="mode-switch" role="tablist" aria-label="計測モード">
        <button id="mode-up" class="mode-btn active" type="button" role="tab" aria-selected="true">カウントアップ</button>
        <button id="mode-down" class="mode-btn" type="button" role="tab" aria-selected="false">カウントダウン</button>
      </div>

      <div id="countdown-panel" class="countdown-panel" hidden>
        <div class="cd-label">目標 <button type="button" id="cd-presets-edit" class="cd-edit-link">✏️ プリセット編集</button></div>

<script type="module">
import { computeRemainingMs, fmtCountdown, crossedZero, normalizeTimerState, fmtClockShort, overtimeNote, distanceMeters, normalizeCountdownPresets } from './js/countdown.js';
import { newRecordId, ensureRecordIds, mergeSyncDocs, pickSettings } from './js/timer-sync.js';
// ============================================================
// --- Pure ---
// 依存のない純粋関数。入出力のみで動く。
// ============================================================

// 秒 → "HH:MM:SS"
function fmtStopwatch(totalSec) {
  const s = Math.max(0, Math.floor(totalSec));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
}

// 分 → "X分"
function fmtMinutesMain(minutes) {
  return `${Math.max(0, Math.floor(minutes))}分`;
}

// 分 → "Y時間Z分"
function fmtMinutesSub(minutes) {
  const m = Math.max(0, Math.floor(minutes));
  const h = Math.floor(m / 60);
  const rem = m % 60;
  return `${h}時間${rem}分`;
}

// ミリ秒 → "X時間Y分"（符号無視）
function fmtDuration(ms) {
  const totalMin = Math.floor(Math.abs(ms) / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return `${h}時間${m}分`;
}

// Date → "HH:MM"
function fmtTime(date) {
  return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
}

// Date → "YYYY/MM/DD (曜)"
function fmtDate(date) {
  const y = date.getFullYear();
  const mo = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
  return `${y}/${mo}/${d} (${weekdays[date.getDay()]})`;
}

// Date + 分 → Date
function addMinutes(date, minutes) {
  return new Date(date.getTime() + minutes * 60 * 1000);
}


// ============================================================
// --- Storage ---
// localStorage のラッパー。スキーマはspec §5.1 参照。
// ============================================================

const STORAGE_KEY = 'taxi-timer-v1';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return normalizeTimerState(null);
    return normalizeTimerState(JSON.parse(raw));
  } catch (e) {
    return normalizeTimerState(null);
  }
}

// クラウドpushのスタブ（Task 4 で実体に置換）。saveStateから呼ぶため先に定義。
function scheduleCloudPush() {}

function saveState(state) {
  // 設定が前回保存から変わっていれば settingsUpdatedAt を更新（設定LWW用・ここ1箇所だけ）
  try {
    const prevRaw = localStorage.getItem(STORAGE_KEY);
    const prevSettings = prevRaw ? pickSettings(JSON.parse(prevRaw)) : null;
    if (JSON.stringify(prevSettings) !== JSON.stringify(pickSettings(state))) {
      state.settingsUpdatedAt = Date.now();
    }
  } catch (e) { /* 比較失敗時は据え置き */ }
  const data = {
    shiftStart: state.shiftStart,
    records: state.records,
    targetBreakMin: state.targetBreakMin,
    continuousDriveMin: state.continuousDriveMin,
    shiftStartAt: state.shiftStartAt,
    lastResetSnapshot: state.lastResetSnapshot,
    breakCountMin: state.breakCountMin,
    mode: state.mode,
    countdownTargetMin: state.countdownTargetMin,
    soundOn: state.soundOn,
    wakeLockOn: state.wakeLockOn,
    alertDurationSec: state.alertDurationSec,
    moveDetectOn: state.moveDetectOn,
    moveThresholdM: state.moveThresholdM,
    countdownPresets: state.countdownPresets,
    settingsUpdatedAt: state.settingsUpdatedAt
  };
  if (state.stopwatch.running && state.stopwatch.startedAt) {
    data.runningStartedAt = state.stopwatch.startedAt;
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  scheduleCloudPush();
}

// ============================================================
// --- State ---
// アプリ実行中の状態。永続値 + ストップウォッチ状態。
// ============================================================

const _loaded = loadState();
const state = {
  shiftStart: _loaded.shiftStart,
  records: _loaded.records,
  targetBreakMin: _loaded.targetBreakMin,
  continuousDriveMin: _loaded.continuousDriveMin,
  shiftStartAt: _loaded.shiftStartAt,
  lastResetSnapshot: _loaded.lastResetSnapshot,
  breakCountMin: _loaded.breakCountMin,
  mode: _loaded.mode,
  countdownTargetMin: _loaded.countdownTargetMin,
  soundOn: _loaded.soundOn,
  wakeLockOn: _loaded.wakeLockOn,
  alertDurationSec: _loaded.alertDurationSec,
  moveDetectOn: _loaded.moveDetectOn,
  moveThresholdM: _loaded.moveThresholdM,
  countdownPresets: _loaded.countdownPresets,
  settingsUpdatedAt: _loaded.settingsUpdatedAt,
  stopwatch: _loaded.runningStartedAt
    ? { running: true, startedAt: _loaded.runningStartedAt, elapsedMs: 0 }
    : { running: false, startedAt: null, elapsedMs: 0 }
};

// 既存recordにid/updatedAt/deletedを補完（移行）。以後 records は墓石を含む全集合。
state.records = ensureRecordIds(state.records);

// カウントダウン0クロス検出用のランタイム状態（永続化しない）
let prevRemainingMs = null;          // 直前tickの残りms（null=未計測）
let countdownNotified = false;       // この走行で0通知済みか
// ロード時点で既に超過しているなら再読込で鳴らさない
if (state.mode === 'down' && state.stopwatch.running) {
  const _ms = state.stopwatch.elapsedMs + (Date.now() - state.stopwatch.startedAt);
  if (computeRemainingMs(_ms, state.countdownTargetMin) <= 0) countdownNotified = true;
}

// Wake Lock（画面常時点灯）。wakeLockOn かつ 走行中 かつ 前面表示中 のときだけ取得。
let wakeLockSentinel = null;
async function syncWakeLock() {
  const want = state.wakeLockOn && state.stopwatch.running && document.visibilityState === 'visible';
  try {
    if (want && !wakeLockSentinel && navigator.wakeLock) {
      wakeLockSentinel = await navigator.wakeLock.request('screen');
      wakeLockSentinel.addEventListener('release', () => { wakeLockSentinel = null; });
    } else if (!want && wakeLockSentinel) {
      await wakeLockSentinel.release();
      wakeLockSentinel = null;
    }
  } catch (e) {
    // 非対応(iOS16.4未満等)やユーザー拒否は no-op
    wakeLockSentinel = null;
  }
}
// 復帰時に再取得（iOSはタブ非表示で自動解放されるため）
document.addEventListener('visibilitychange', () => { syncWakeLock(); });

// 表示・集計用：墓石(deleted)を除いた活動レコード。
function activeRecords() { return state.records.filter((r) => !r.deleted); }

function currentStopwatchMs() {
  if (!state.stopwatch.running) return state.stopwatch.elapsedMs;
  return state.stopwatch.elapsedMs + (Date.now() - state.stopwatch.startedAt);
}

// ============================================================
// --- Render ---
// 状態から DOM を更新する。副作用のみ。
// ============================================================

const $ = (id) => document.getElementById(id);

function renderDate() {
  $('today-date').textContent = fmtDate(new Date());
}

function renderShiftStart() {
  $('shift-start-input').value = state.shiftStart;
}

function renderTargetBreak() {
  const m = Math.max(0, Math.floor(state.targetBreakMin));
  $('target-break-hour').value = Math.floor(m / 60);
  $('target-break-min').value = m % 60;
}

function renderContinuousDrive() {
  const m = Math.max(0, Math.floor(state.continuousDriveMin));
  $('continuous-drive-hour').value = Math.floor(m / 60);
  $('continuous-drive-min').value = m % 60;
}

function renderBreakCount() {
  const m = Math.max(0, Math.floor(state.breakCountMin));
  $('break-count-min').value = m;
}

function renderStopwatch() {
  const ms = currentStopwatchMs();
  const display = $('stopwatch-display');
  const overNote = $('countdown-over-note');
  if (state.mode === 'down') {
    const remaining = computeRemainingMs(ms, state.countdownTargetMin);
    if (remaining > 0) {
      // 残りあり: カウントダウン表示
      display.textContent = fmtCountdown(remaining);
      display.classList.remove('over');
      if (overNote) overNote.textContent = '';
    } else {
      // 0到達後: 合計経過をカウントアップ表示 + 目標/超過の注記
      display.textContent = fmtClockShort(ms);
      display.classList.add('over');
      if (overNote) overNote.textContent = overtimeNote(ms, state.countdownTargetMin);
    }
  } else {
    display.textContent = fmtStopwatch(ms / 1000);
    display.classList.remove('over');
    if (overNote) overNote.textContent = '';
  }
  const startedEl = $('stopwatch-started');
  const provisionalEl = $('provisional-break');
  if (state.stopwatch.running && state.stopwatch.startedAt) {
    startedEl.textContent = `開始 ${fmtTime(new Date(state.stopwatch.startedAt))}`;
    const recordedMin = Math.floor(activeRecords().reduce((s, r) => s + r.durationSec, 0) / 60);
    const currentMin = Math.floor(ms / 60000);
    const provisionalMin = recordedMin + currentMin;
    provisionalEl.textContent = `暫定休憩 ${fmtMinutesSub(provisionalMin)}（記録済み ${fmtMinutesSub(recordedMin)} + 現在 ${fmtMinutesSub(currentMin)}）`;
  } else {
    startedEl.textContent = '';
    provisionalEl.textContent = '';
  }
}

function renderCountdownPanel() {
  // モードボタンの選択状態
  const down = state.mode === 'down';
  $('mode-up').classList.toggle('active', !down);
  $('mode-down').classList.toggle('active', down);
  $('mode-up').setAttribute('aria-selected', String(!down));
  $('mode-down').setAttribute('aria-selected', String(down));
  // パネル表示
  $('countdown-panel').hidden = !down;
  // 目標プリセット：ユーザー設定の分数を data-min と表示に反映＋選択ハイライト
  // （#cd-presets に限定。長さチップを巻き込まない）
  document.querySelectorAll('#cd-presets .cd-preset').forEach((b, i) => {
    const min = state.countdownPresets[i];
    if (Number.isFinite(min)) { b.dataset.min = String(min); b.textContent = `${min}分`; }
    b.classList.toggle('active', Number(b.dataset.min) === state.countdownTargetMin);
  });
  // 自由入力（フォーカス中は上書きしない）
  const hourEl = $('cd-hour'), minEl = $('cd-min');
  if (document.activeElement !== hourEl && document.activeElement !== minEl) {
    const m = Math.max(0, Math.floor(state.countdownTargetMin));
    hourEl.value = Math.floor(m / 60);
    minEl.value = m % 60;
  }
  // トグル
  $('cd-sound').checked = state.soundOn;
  $('cd-wakelock').checked = state.wakeLockOn;
  // 通知音の長さ（音ONのときだけ出す + 選択チップをハイライト）
  $('cd-sound-dur').hidden = !state.soundOn;
  document.querySelectorAll('#alert-dur-presets .cd-preset').forEach(b => {
    b.classList.toggle('active', Number(b.dataset.sec) === state.alertDurationSec);
  });
}

function renderButtons() {
  const ms = currentStopwatchMs();
  const running = state.stopwatch.running;
  $('btn-start').disabled = running;
  $('btn-record').disabled = !running || ms < state.breakCountMin * 60 * 1000;
  $('btn-discard').disabled = !running;
}

function renderMetrics() {
  // 休憩時間メトリクス
  const totalBreakSec = activeRecords().reduce((s, r) => s + r.durationSec, 0);
  const totalBreakMin = Math.floor(totalBreakSec / 60);
  $('break-total-main').textContent = fmtMinutesMain(totalBreakMin);
  $('break-total-sub').textContent = fmtMinutesSub(totalBreakMin);
  const remainBreakMin = Math.max(0, state.targetBreakMin - totalBreakMin);
  $('break-remaining-main').textContent = fmtMinutesMain(remainBreakMin);
  $('break-remaining-sub').textContent = fmtMinutesSub(remainBreakMin);

  // 目標達成時は青色ハイライト
  const achieved = totalBreakMin >= state.targetBreakMin;
  $('break-total-card').classList.toggle('complete', achieved);
  $('break-remaining-card').classList.toggle('complete', achieved);

  // 基準時刻: 最新記録 > 勤務開始時刻 > 未開始
  const now = new Date();
  let baseDate = null;
  const _active = activeRecords();
  if (_active.length > 0) {
    baseDate = new Date(_active[_active.length - 1].recordedAt);
  } else if (state.shiftStartAt) {
    baseDate = new Date(state.shiftStartAt);
  }

  const card = $('deadline-card');
  card.classList.remove('warn', 'danger', 'over');

  if (!baseDate) {
    $('deadline-time').textContent = '乗務未開始';
    $('deadline-remaining').textContent = '下の「乗務を開始」を押してください';
    return;
  }

  const deadline = addMinutes(baseDate, state.continuousDriveMin);
  const remainingMs = deadline.getTime() - now.getTime();

  $('deadline-time').textContent = `${fmtTime(deadline)} まで`;
  $('deadline-remaining').textContent = remainingMs < 0
    ? `超過 ${fmtDuration(remainingMs)}`
    : `残り ${fmtDuration(remainingMs)}`;

  if (remainingMs < 0) card.classList.add('over');
  else if (remainingMs <= 30 * 60 * 1000) card.classList.add('danger');
  else if (remainingMs <= 60 * 60 * 1000) card.classList.add('warn');
}

function renderHistory() {
  const list = $('history-list');
  $('history-count').textContent = activeRecords().length;
  list.innerHTML = '';
  const sorted = [...activeRecords()].sort(
    (a, b) => new Date(b.recordedAt) - new Date(a.recordedAt)
  );
  for (const r of sorted) {
    const li = document.createElement('li');
    const recDate = new Date(r.recordedAt);
    const startDate = new Date(recDate.getTime() - r.durationSec * 1000);
    const mins = Math.floor(r.durationSec / 60);
    const nextDeadline = fmtTime(addMinutes(recDate, state.continuousDriveMin));

    const timeEl = document.createElement('span');
    timeEl.className = 'rec-time';
    timeEl.textContent = `${fmtTime(startDate)} → ${fmtTime(recDate)}`;

    const durEl = document.createElement('span');
    durEl.className = 'rec-dur';
    durEl.textContent = `${mins}分`;

    const nextEl = document.createElement('span');
    nextEl.className = 'rec-next';
    nextEl.textContent = nextDeadline;

    const editBtn = document.createElement('button');
    editBtn.className = 'btn-rec-edit';
    editBtn.type = 'button';
    editBtn.textContent = '✎';
    editBtn.setAttribute('aria-label', '記録を編集');
    editBtn.addEventListener('click', () => openEditDialog(r));

    const delBtn = document.createElement('button');
    delBtn.className = 'btn-rec-delete';
    delBtn.type = 'button';
    delBtn.textContent = '×';
    delBtn.setAttribute('aria-label', '記録を削除');
    delBtn.addEventListener('click', () => {
      if (!confirm(`${fmtTime(startDate)} → ${fmtTime(recDate)} (${mins}分) を削除しますか？`)) return;
      const di = state.records.findIndex(x => x.id === r.id);
      if (di >= 0) state.records[di] = { ...state.records[di], deleted: true, updatedAt: Date.now() };
      saveState(state);
      renderAll();
    });

    li.appendChild(timeEl);
    li.appendChild(durEl);
    li.appendChild(nextEl);
    li.appendChild(editBtn);
    li.appendChild(delBtn);
    list.appendChild(li);
  }
}

function renderUndoReset() {
  const btn = $('btn-undo-reset');
  const snap = state.lastResetSnapshot;
  if (!isResetSnapshotValid(snap)) {
    btn.hidden = true;
    if (snap) { state.lastResetSnapshot = null; saveState(state); }
    return;
  }
  const count = Array.isArray(snap.records) ? snap.records.length : 0;
  const t = fmtTime(new Date(snap.savedAt));
  btn.hidden = false;
  btn.textContent = `↩ ${t} のリセットを取り消す（記録${count}件を復元）`;
}

// ------------------------------------------------------------
// 休憩記録の編集ダイアログ
// ------------------------------------------------------------
let editingRecordedId = null;

function pad2(n) { return String(n).padStart(2, '0'); }
function hmFromDate(d) { return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }

function openEditDialog(record) {
  editingRecordedId = record.id;
  const endDate = new Date(record.recordedAt);
  const startDate = new Date(endDate.getTime() - record.durationSec * 1000);
  $('edit-start').value = hmFromDate(startDate);
  $('edit-end').value = hmFromDate(endDate);
  updateEditPreview();
  $('edit-dialog').showModal();
}

function parseHM(s) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(s || '');
  if (!m) return null;
  const h = +m[1], mi = +m[2];
  if (h < 0 || h > 23 || mi < 0 || mi > 59) return null;
  return { h, m: mi };
}

// 編集対象記録の元日付（recordedAt の日付）を基準に、HH:MM を Date に変換
function dateFromHMOnSameDay(baseDate, hm) {
  const d = new Date(baseDate);
  d.setHours(hm.h, hm.m, 0, 0);
  return d;
}

function computeEditedRange() {
  const rec = state.records.find(x => x.id === editingRecordedId);
  if (!rec) return { error: '記録が見つかりません' };
  const startHM = parseHM($('edit-start').value);
  const endHM = parseHM($('edit-end').value);
  if (!startHM || !endHM) return { error: '時刻の形式が不正です' };
  const baseEnd = new Date(rec.recordedAt);
  const startDate = dateFromHMOnSameDay(baseEnd, startHM);
  const endDate = dateFromHMOnSameDay(baseEnd, endHM);
  if (endDate <= startDate) return { error: '終了は開始より後にしてください' };
  if (endDate.getTime() > Date.now() + 60 * 1000) return { error: '終了が未来の時刻です' };
  const durationSec = Math.floor((endDate.getTime() - startDate.getTime()) / 1000);
  return { startDate, endDate, durationSec };
}

function updateEditPreview() {
  const preview = $('edit-duration-preview');
  const saveBtn = $('edit-save');
  const r = computeEditedRange();
  if (r.error) {
    preview.textContent = r.error;
    preview.classList.add('is-error');
    saveBtn.disabled = true;
    return;
  }
  const mins = Math.floor(r.durationSec / 60);
  preview.textContent = `${mins}分`;
  preview.classList.remove('is-error');
  saveBtn.disabled = false;
}

$('edit-start').addEventListener('input', updateEditPreview);
$('edit-end').addEventListener('input', updateEditPreview);

$('edit-cancel').addEventListener('click', () => {
  editingRecordedId = null;
  $('edit-dialog').close();
});

$('edit-save').addEventListener('click', () => {
  const r = computeEditedRange();
  if (r.error) return; // disabled時は呼ばれない想定だが念のため
  const idx = state.records.findIndex(x => x.id === editingRecordedId);
  if (idx < 0) { $('edit-dialog').close(); return; }
  state.records[idx] = {
    ...state.records[idx],
    recordedAt: r.endDate.toISOString(),
    durationSec: r.durationSec,
    updatedAt: Date.now()
  };
  editingRecordedId = null;
  saveState(state);
  renderAll();
  $('edit-dialog').close();
});

function readHMInput(hourId, minId) {
  const h = parseInt($(hourId).value, 10);
  const m = parseInt($(minId).value, 10);
  const hh = Number.isFinite(h) && h >= 0 ? h : 0;
  const mm = Number.isFinite(m) && m >= 0 ? m : 0;
  return hh * 60 + mm;
}

function onTargetBreakChange() {
  const total = readHMInput('target-break-hour', 'target-break-min');
  state.targetBreakMin = total;
  saveState(state);
  renderAll();
}
$('target-break-hour').addEventListener('change', onTargetBreakChange);
$('target-break-min').addEventListener('change', onTargetBreakChange);

function onContinuousDriveChange() {
  const total = readHMInput('continuous-drive-hour', 'continuous-drive-min');

  saveState(state);

}
$('continuous-drive-hour').addEventListener('change', onContinuousDriveChange);
$('continuous-drive-min').addEventListener('change', onContinuousDriveChange);

function onBreakCountChange() {

  state.breakCountMin = Number.isFinite(v) && v >= 0 ? v : 11;
  saveState(state);

$('break-count-min').addEventListener('change', onBreakCountChange);

// --- カウントダウン: モード・目標・トグル ---
function setMode(mode) {
  state.mode = mode === 'down' ? 'down' : 'up';
  prevRemainingMs = null;            // モード切替で0クロス追跡をリセット
  countdownNotified = false;         // モード切替で通知を再武装
  saveState(state);
  renderAll();
}
$('mode-up').addEventListener('click', () => setMode('up'));
$('mode-down').addEventListener('click', () => setMode('down'));

function setCountdownTarget(min) {
  const v = Math.max(1, Math.floor(min));
  state.countdownTargetMin = v;
  prevRemainingMs = null;            // 目標変更で0クロス追跡をリセット
  countdownNotified = false;         // 目標を変えたら通知を再武装
  saveState(state);
  renderAll();
}
document.querySelectorAll('#cd-presets .cd-preset').forEach(b => {
  b.addEventListener('click', () => setCountdownTarget(Number(b.dataset.min)));

// --- 目標プリセットの編集 ---
function openPresetEditor() {

  });
  $('cd-presets').hidden = true;
  $('cd-presets-editor').hidden = false;

  if (save) {
    const vals = [...document.querySelectorAll('.cd-preset-edit')].map(inp => parseInt(inp.value, 10));
    state.countdownPresets = normalizeCountdownPresets(vals);  // 不正値は同位置の既定へ

  $('cd-presets').hidden = false;

// 通知音の長さチップ（data-sec。0=止めるまで）
document.querySelectorAll('#alert-dur-presets .cd-preset').forEach(b => {

$('cd-sound').addEventListener('change', (e) => {
  state.soundOn = !!e.target.checked;
  if (!state.soundOn) stopAlertSound();   // 音OFFにしたら鳴っている音を止める
  saveState(state);
  renderCountdownPanel();                 // 長さ設定の表示/非表示を更新

$('btn-settings-toggle').addEventListener('click', () => {
  const content = $('settings-content');
  const toggle = $('btn-settings-toggle');
  const willOpen = content.hidden;
  content.hidden = !willOpen;
  toggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');

// --- 0クロス通知 ---
let audioCtx = null;
function ensureAudio() {
  // iOS の自動再生制限解除のため、ユーザー操作(スタート)時に生成/resume する
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { /* 非対応環境は無視 */ }
}
// 短音×2を1回だけ鳴らす（旧 beep の本体）。
function playBlip() {
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    [0, 0.25].forEach((offset) => {           // 短音×2
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, now + offset);
      gain.gain.exponentialRampToValueAtTime(0.3, now + offset + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.18);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now + offset); osc.stop(now + offset + 0.2);
    });
  } catch (e) { /* 無視 */ }
}

// 通知音を alertDurationSec ぶん繰り返す。0=止めるまで鳴り続ける。
let alertTimer = null;       // 繰り返し用 setInterval id
let alertStopTimer = null;   // 自動停止用 setTimeout id
function startAlertSound() {
  if (!state.soundOn || !audioCtx) return;   // 音OFF/非対応なら鳴らさない（ボタンも出さない）
  stopAlertSound();                          // 二重起動防止
  playBlip();
  alertTimer = setInterval(playBlip, 900);   // 約0.9秒ごとに繰り返す
  if (state.alertDurationSec > 0) {
    alertStopTimer = setTimeout(stopAlertSound, state.alertDurationSec * 1000);
  }
  const btn = $('btn-stop-alert');
  if (btn) btn.hidden = false;               // 鳴っている間だけ「音を止める」を出す
}
function stopAlertSound() {
  if (alertTimer) { clearInterval(alertTimer); alertTimer = null; }
  if (alertStopTimer) { clearTimeout(alertStopTimer); alertStopTimer = null; }
  const btn = $('btn-stop-alert');
  if (btn) btn.hidden = true;
}

function fireZeroNotification() {
  startAlertSound();                            // soundOn のときだけ鳴る（中で判定）
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
  const sw = document.querySelector('.stopwatch');
  if (sw) { sw.classList.remove('flash'); void sw.offsetWidth; sw.classList.add('flash'); }
}

$('btn-stop-alert').addEventListener('click', stopAlertSound);

// --- 移動検知（休憩終了ポップアップ） ---
// 休憩中、GPSで開始地点からの直線距離を監視。moveThresholdM を超えたら
// 「終了する？」のポップアップを出す。前面表示中のみ動作（iOSは裏で凍結）。
let moveWatchId = null;
let breakStartCoord = null;   // {lat, lon} 休憩開始地点（最初のGPS fix）
let moveCrossingAt = null;    // しきい値を超えた時刻(ms)
let movePrompting = false;    // ポップアップ表示中フラグ

function startMoveWatch() {
  stopMoveWatch();
  if (!state.moveDetectOn || !navigator.geolocation) return;
  try {
    moveWatchId = navigator.geolocation.watchPosition(onMovePosition, () => {}, {
      enableHighAccuracy: false, timeout: 20000, maximumAge: 5000
    });
  } catch (e) { moveWatchId = null; }   // 非対応/拒否は無効
}
function stopMoveWatch() {
  if (moveWatchId != null && navigator.geolocation) {
    try { navigator.geolocation.clearWatch(moveWatchId); } catch (e) {}
  }
  moveWatchId = null;
  breakStartCoord = null;
  moveCrossingAt = null;
  movePrompting = false;
}
function onMovePosition(pos) {
  if (!state.stopwatch.running || movePrompting) return;
  if (pos.coords.accuracy != null && pos.coords.accuracy > 200) return; // 精度悪い読みは無視
  const cur = { lat: pos.coords.latitude, lon: pos.coords.longitude };
  if (!breakStartCoord) { breakStartCoord = cur; return; }              // 最初のfixを基準点に
  const dist = distanceMeters(breakStartCoord, cur);
  if (dist >= state.moveThresholdM) {
    const dlg = $('move-detect-dialog');
    // ダイアログが実際に開けた時だけ prompting を立てる（開けないまま固まり防止）
    if (dlg && typeof dlg.showModal === 'function' && !dlg.open) {
      moveCrossingAt = Date.now();
      movePrompting = true;
      $('move-detect-dist').textContent = `約${Math.round(dist)}m`;
      $('move-detect-end').textContent = fmtTime(new Date(moveCrossingAt));
      dlg.showModal();
    }
  }
}

$('move-detect-yes').addEventListener('click', () => {
  $('move-detect-dialog').close();
  const startedAt = state.stopwatch.startedAt;
  const end = moveCrossingAt;
  // しきい値を超えた時刻で休憩を締めて記録（開始は既知なので正確）
  if (state.stopwatch.running && startedAt && end && end > startedAt) {
    const durationSec = Math.floor((end - startedAt) / 1000);
    // 手動「記録」と同じく休憩カウント最低分を満たす時だけ記録（満たない短い停車は記録せず停止のみ）
    if (durationSec >= state.breakCountMin * 60) {
      state.records.push({ id: newRecordId(), recordedAt: new Date(end).toISOString(), durationSec, updatedAt: Date.now(), deleted: false });
    }
  }
  stopAlertSound();
  state.stopwatch.running = false;
  state.stopwatch.startedAt = null;
  state.stopwatch.elapsedMs = 0;
  prevRemainingMs = null;
  countdownNotified = false;
  stopMoveWatch();
  saveState(state);
  syncWakeLock();
  renderAll();
});
$('move-detect-no').addEventListener('click', () => {
  $('move-detect-dialog').close();
  // 継続。基準点をリセット（次のfixを新基準に）→ また500m動くまで再表示しない
  breakStartCoord = null;
  moveCrossingAt = null;
  movePrompting = false;
});
// ESC等でダイアログを閉じた場合も「いいえ」と同じく基準点をリセットして監視継続
// （これが無いと movePrompting が立ったまま検知が止まる）
$('move-detect-dialog').addEventListener('cancel', () => {
  breakStartCoord = null;
  moveCrossingAt = null;
  movePrompting = false;
});

function renderMoveSettings() {
  $('move-detect-on').checked = state.moveDetectOn;
  const thRow = $('move-threshold-row');
  if (thRow) thRow.hidden = !state.moveDetectOn;
  const thEl = $('move-threshold-m');
  if (thEl && document.activeElement !== thEl) thEl.value = state.moveThresholdM;
}
$('move-detect-on').addEventListener('change', (e) => {
  state.moveDetectOn = !!e.target.checked;
  saveState(state);
  renderMoveSettings();
  if (!state.moveDetectOn) stopMoveWatch();
  else if (state.stopwatch.running) startMoveWatch();
});
$('move-threshold-m').addEventListener('change', () => {
  const v = parseInt($('move-threshold-m').value, 10);
  state.moveThresholdM = (Number.isFinite(v) && v >= 100) ? v : 500;
  saveState(state);
  renderMoveSettings();
});

const RESET_UNDO_TTL_MS = 24 * 60 * 60 * 1000; // 24時間

function captureResetSnapshot() {
  const hasData = activeRecords().length > 0 || state.shiftStartAt !== null;
  if (!hasData) return null;
  return {
    records: [...state.records],
    shiftStartAt: state.shiftStartAt,
    shiftStart: state.shiftStart,
    savedAt: Date.now(),
  };
}

function isResetSnapshotValid(snap) {
  return !!snap && (Date.now() - snap.savedAt) < RESET_UNDO_TTL_MS;
}

$('btn-reset').addEventListener('click', () => {
  const hasData = activeRecords().length > 0 || state.shiftStartAt !== null || state.stopwatch.running;
  if (hasData && !confirm('現在の乗務記録をリセットして新しい乗務を開始します。よろしいですか？')) return;
  stopAlertSound();
  stopMoveWatch();
  state.lastResetSnapshot = captureResetSnapshot();
  state.records = [];
  state.stopwatch.running = false;
  state.stopwatch.startedAt = null;
  state.stopwatch.elapsedMs = 0;
  // 基点は「今日の乗務開始時刻」
  const [h, m] = state.shiftStart.split(':').map(Number);
  const baseline = new Date();
  baseline.setHours(h, m, 0, 0);
  state.shiftStartAt = baseline.getTime();
  saveState(state);
  syncWakeLock();
  renderAll();
});

$('btn-undo-reset').addEventListener('click', () => {
  const snap = state.lastResetSnapshot;
  if (!isResetSnapshotValid(snap)) return;
  state.records = Array.isArray(snap.records) ? snap.records : [];
  state.shiftStartAt = typeof snap.shiftStartAt === 'number' ? snap.shiftStartAt : null;
  state.shiftStart = snap.shiftStart || state.shiftStart;
  state.lastResetSnapshot = null;
  saveState(state);
  renderAll();
});

// ============================================================
// --- Tick ---
// 1秒ごとに時計・メトリクス・ボタン状態を再描画する。
// ============================================================

const MAX_SHIFT_MS = 20 * 60 * 60 * 1000;

setInterval(() => {
  // 20時間経過で自動リセット（基準日時と記録をクリア）
  if (state.shiftStartAt && Date.now() - state.shiftStartAt > MAX_SHIFT_MS) {
    state.lastResetSnapshot = captureResetSnapshot();
    state.shiftStartAt = null;
    state.records = [];
    state.stopwatch.running = false;
    state.stopwatch.startedAt = null;
    state.stopwatch.elapsedMs = 0;
    saveState(state);
    renderAll();
    return;
  }
  // カウントダウンの0クロス検出（前面表示中のみ動作）
  if (state.mode === 'down' && state.stopwatch.running) {
    const remaining = computeRemainingMs(currentStopwatchMs(), state.countdownTargetMin);
    if (!countdownNotified && prevRemainingMs !== null && crossedZero(prevRemainingMs, remaining)) {
      countdownNotified = true;
      fireZeroNotification();
    }
    prevRemainingMs = remaining;
  } else {
    prevRemainingMs = null;
  }
  renderStopwatch();
  renderMetrics();
  renderButtons();
}, 1000);

// ============================================================
// --- Init ---
// ============================================================

renderAll();
syncWakeLock();   // リロード時に running かつ wakeLockOn なら再取得
if (state.stopwatch.running) startMoveWatch();   // リロード時も休憩中なら移動検知を再開

// Keep tab navigation inside standalone/PWA mode on iOS (prevents kick-out to Safari)
document.querySelectorAll('.app-tab').forEach(a => {
  a.addEventListener('click', (e) => {
    if (e.ctrlKey || e.metaKey || e.shiftKey) return;
    e.preventDefault();
    window.location.href = a.getAttribute('href');
  });
});

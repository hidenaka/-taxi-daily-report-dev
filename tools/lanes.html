<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>23区 車線数マップ（試作）</title>
  <link rel="stylesheet" href="../vendor/maplibre/maplibre-gl.css">
  <style>
    html,body{margin:0;height:100%;font-family:-apple-system,"Hiragino Sans",system-ui,sans-serif;}
    #map{position:absolute;inset:0;}
    .panel{position:absolute;left:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:5;background:rgba(255,255,255,.95);
      border-radius:12px;padding:10px 12px;box-shadow:0 4px 16px rgba(0,0,0,.2);font-size:13px;line-height:1.5;max-width:min(320px,calc(100vw - 20px));}
    .panel h1{font-size:15px;margin:0 0 6px;}
    .row{display:flex;align-items:center;gap:6px;}
    .sw{display:inline-block;width:22px;height:5px;border-radius:3px;}
    .note{color:#555;font-size:11.5px;margin-top:6px;}
    .src label{margin-right:8px;white-space:nowrap;}
    #toggle{position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:5;border:0;border-radius:10px;padding:8px 10px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:13px;}
    .maplibregl-popup-content{border-radius:10px;font-size:13px;}
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel" id="panel">
    <h1>23区の車線の数（試作）</h1>
    <div class="row"><span class="sw" style="background:#9aa3ab"></span>1車線</div>
    <div class="row"><span class="sw" style="background:#2b8cbe"></span>2車線</div>
    <div class="row"><span class="sw" style="background:#31a354"></span>3車線</div>
    <div class="row"><span class="sw" style="background:#fdae61"></span>4車線</div>
    <div class="row"><span class="sw" style="background:#e6550d"></span>5〜6車線</div>
    <div class="row"><span class="sw" style="background:#a50f15"></span>7車線以上</div>
    <div class="row"><span class="sw" style="background:repeating-linear-gradient(90deg,#c51b8a 0 4px,transparent 4px 7px)"></span>分からない</div>
    <div class="src" style="margin-top:6px">
      <label><input type="checkbox" id="s-o" checked> 地図の登録</label>
      <label><input type="checkbox" id="s-p" checked> 写真で数えた</label>
      <label><input type="checkbox" id="s-u" checked> 分からない</label>
    </div>
    <div class="note">数は両方向の合計。一方通行の道は、その向きの数です。「写真で数えた」は細い線で表示しています。数がすでに分かっている24本で試したところ、ぴったり合ったのは約半分、1本違い以内は約9割でした。</div>
  </div>
  <button id="toggle">説明</button>
  <script src="../vendor/maplibre/maplibre-gl.js"></script>
  <script>
    const color=['case',['==',['get','l'],null],'#c51b8a',
      ['step',['get','l'],'#9aa3ab',2,'#2b8cbe',3,'#31a354',4,'#fdae61',5,'#e6550d',7,'#a50f15']];
    const map=new maplibregl.Map({container:'map',center:[139.75,35.69],zoom:12,maxZoom:18,minZoom:9,
      attributionControl:{compact:true},
      style:{version:8,sources:{pale:{type:'raster',tiles:['https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png'],tileSize:256,maxzoom:18,
        attribution:'地理院タイル ／ 道路: © OpenStreetMap contributors (ODbL) ／ 車線数の一部: 地理院タイル（全国最新写真）を目視'}},
        layers:[{id:'pale',type:'raster',source:'pale',paint:{'raster-saturation':-0.6,'raster-opacity':0.85}}]}});
    map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
    const filt=()=>{const s=[];if(document.getElementById('s-o').checked)s.push('o');if(document.getElementById('s-p').checked)s.push('p');if(document.getElementById('s-u').checked)s.push('u');return ['in',['get','s'],['literal',s]];};
    map.on('load',()=>{
      map.addSource('lanes',{type:'geojson',data:'lanes/lanes23.geojson'});
      map.addLayer({id:'lanes-solid',type:'line',source:'lanes',filter:['all',filt(),['!=',['get','s'],'u']],
        layout:{'line-cap':'round','line-join':'round'},
        paint:{'line-color':color,'line-width':['interpolate',['linear'],['zoom'],10,['case',['==',['get','s'],'p'],1,1.6],15,['case',['==',['get','s'],'p'],3,5]]}});
      map.addLayer({id:'lanes-unk',type:'line',source:'lanes',filter:['all',filt(),['==',['get','s'],'u']],
        paint:{'line-color':'#c51b8a','line-width':['interpolate',['linear'],['zoom'],10,1,15,3],'line-dasharray':[2,1.5]}});
      const src={o:'地図の登録（OpenStreetMap）',p:'航空写真で目で数えた',u:'分からない'};
      for(const id of ['lanes-solid','lanes-unk']){
        map.on('click',id,e=>{const p=e.features[0].properties;
          new maplibregl.Popup().setLngLat(e.lngLat).setHTML(`<b>${p.n||'（名前なし）'}</b><br>車線の数：${p.l==null||p.l==='null'?'分からない':p.l}${p.o==1?'（一方通行）':''}<br>出どころ：${src[p.s]}`).addTo(map);});
        map.on('mouseenter',id,()=>map.getCanvas().style.cursor='pointer');
        map.on('mouseleave',id,()=>map.getCanvas().style.cursor='');
      }
      for(const k of ['s-o','s-p','s-u']) document.getElementById(k).addEventListener('change',()=>{
        map.setFilter('lanes-solid',['all',filt(),['!=',['get','s'],'u']]);map.setFilter('lanes-unk',['all',filt(),['==',['get','s'],'u']]);});
    });
    document.getElementById('toggle').onclick=()=>{const p=document.getElementById('panel');p.hidden=!p.hidden;};
  </script>
</body>
</html>
